<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"> 
    <meta name="description" content="An enhanced counter app to track the number of people entered and save the entries."> 
    <meta name="author" content="Shi'era frontend developer"> 
    <meta name="keywords" content="counter, increment, save, tracker, people counter">
    <title>Enhanced Counter App</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container" id="container">
      <h1>People Entered</h1>
      <h2 id="count-el">0</h2>
      <button class="increment-btn"
      onclick="increment()">Increment</button>
      <P id="save-el">Previous Entries: </p>
      <button class="save-btn" onclick="save()"><span>Save</span></button>
    </div>
    <script src="index.js"></script>
  </body>
</html>
