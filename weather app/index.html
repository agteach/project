
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <title>Interactive weather app</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="weather-app">
        <div class="container">
            <h3 class="brand">the weather</h3>
            <div>
              
                <h1 class="temp">16 &#x2103;</h1>
                <div class="city-time">
                    <h1 class="name">London</h1>
                    <small>
                        <span class="time">06:09</span>
                        <span class="date">
                            Mondey sep 19
                        </span>
                    </small>
                </div>
                <div class="weather">
                    <img src="images/partly-cloudy.png" alt="partly-cloudy" width="50"
                    height="50"/>
                    <span class="condition">cloudy</span>

                </div>
            </div>
        </div>
        <div class="panel">
            <form action="" id="locationInput">
             <input type="text" class="search" placeholder="search Location...">
             <button type="submit" class="submit">
                <i class="fas fa-search"></i>
             </button>   
            </form>
            <ul class="cities">
                <li class="city">New York</li>
                <li class="city">Jimma</li>
                <li class="city">London </li>
                <li class="city">Brasília</li>
                <li class="city">Dubai</li>
                <li class="city">Canberra</li>
            </ul>
            <ul class="details">
                <h4>Weather Details</h4>
                <li>
                   <span>cloudy</span> 
                   <span class="cloud">89%</span>
                </li>
                <li>
                    <span>Humidity</span>
                    <span class="humidity">64%</span>
                </li>
                <li>
                    <span>Wind</span>
                    <span class="wind">8km/h</span>
                </li>
            </ul>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
