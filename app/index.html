<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic History Quiz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="app">
    <div class="header">
        <h1>Islamic History Quiz</h1>
        <p>Test your knowledge of Islamic history and heritage</p>
    </div>

    <div class="category-selector">
        <button class="category-btn active" data-category="general">General History</button>
        <button class="category-btn" data-category="prophets">Prophets</button>
        <button class="category-btn" data-category="civilization">Islamic Civilization</button>
    </div>

    <div class="quiz-info">
        <div class="info-item">
            <h3>Question</h3>
            <p id="question-number">1/10</p>
        </div>
        <div class="info-item">
            <h3>Score</h3>
            <p id="score">0</p>
        </div>
        <div class="info-item">
            <h3>Time</h3>
            <p id="timer">60s</p>
        </div>
    </div>

    <div class="progress">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="hint-container" id="hint-container">
        <p id="hint-text"></p>
    </div>

    <div class="quiz">
        <h2 id="question">Question goes here</h2>
        <div id="answer-buttons">
            <button class="btn"><i class="fas fa-circle"></i>Answer 1</button>
            <button class="btn"><i class="fas fa-circle"></i>Answer 2</button>
            <button class="btn"><i class="fas fa-circle"></i>Answer 3</button>
            <button class="btn"><i class="fas fa-circle"></i>Answer 4</button>
        </div>
        <div class="controls">
            <button id="hint-btn">Hint</button>
            <button id="next-btn">Next</button>
        </div>
    </div>
    <div class="islamic-pattern">
        <i class="fas fa-mosque"></i>
    </div>
   </div>

  <script src="script.js"></script>
</body>
</html>
